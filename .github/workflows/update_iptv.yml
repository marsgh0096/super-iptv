name: 自动更新北京联通 IPTV 单播地址池

on:
  schedule:
    # 每 2 小时自动运行一次
   # - cron: '0 */2 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        pip install httpx

    - name: 执行测活与过滤脚本
      env:
        HUNTER_KEY: ${{ secrets.HUNTER_KEY }}
        QUAKE_KEY: ${{ secrets.QUAKE_KEY }}
      run: |
        python scripts/harvest.py

    - name: 自动提交并推送更新的 M3U 播放列表
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        if [ -f playlist.m3u ]; then
          git add playlist.m3u nodes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新: 最新可用联通 udpxy 播放列表与节点池" && git push)
        else
          echo "⚠️ 未生成 playlist.m3u 文件（可能因为本轮没有扫描到健康的公网节点），跳过提交！"
        fi
